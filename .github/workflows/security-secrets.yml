name: security · secrets scan

# Fail the pipeline on any leaked secret ever committed. Scans full history
# on push to main, and only the diff on pull requests to keep PRs fast.
# Additive to upstream CI; safe to remove without breaking other jobs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required in both PR and push contexts so gitleaks can
          # resolve the commit range. Shallow clones (depth=1) leave the parent
          # commit unavailable and cause `git log <sha>^..<sha>` to abort.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          # No license required for public repos.
